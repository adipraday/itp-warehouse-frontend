# nginx (host, bukan container) — static SPA hosting buat wms.itpintar.co.id.
# Pola persis sama seperti admin.itpintar.co.id (sibling app di VPS yang sama): static files +
# fallback ke index.html buat client-side routing (React Router BrowserRouter). Backend API
# (api-wms.itpintar.co.id, auth.itpintar.co.id) di subdomain terpisah masing-masing dengan
# reverse-proxy nginx-nya sendiri — situs ini TIDAK proxy /api sama sekali, cuma serve file statis.
#
# Setup pertama kali (butuh sudo):
#   sudo mkdir -p /var/www/wms-frontend/dist
#   sudo chown -R adiprada:adiprada /var/www/wms-frontend
#   sudo cp deploy/nginx-wms.conf /etc/nginx/sites-available/wms.itpintar.co.id
#   sudo ln -s /etc/nginx/sites-available/wms.itpintar.co.id /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d wms.itpintar.co.id
#
# Redeploy (upload build baru) — TIDAK butuh sudo/reload nginx, cuma ganti isi dist/:
#   rsync -avz --delete dist/ adiprada@157.20.95.5:/var/www/wms-frontend/dist/

server {
    server_name wms.itpintar.co.id;

    root /var/www/wms-frontend/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    listen 80;
    listen [::]:80;
    # `certbot --nginx -d wms.itpintar.co.id` akan otomatis nambahin block 443 ssl +
    # redirect 80→443 di sini, persis pola auth/api-wms/admin — jangan tambahin manual.
}
